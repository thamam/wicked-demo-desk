name: wicked-callable-sdlc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callable-verify:
    name: callable-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
